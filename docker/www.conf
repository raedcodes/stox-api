[www]
user = www-data
group = www-data
listen = 9000

; Default php-fpm.d/www.conf ships pm.max_children = 5, which a single active
; user can exceed on their own — every Filament/Livewire page load fires
; several concurrent component-update requests, not just one. Raised here
; with modest spare-server counts to stay reasonable on a small Render
; instance rather than assuming unlimited memory.
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
